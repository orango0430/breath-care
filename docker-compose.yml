services:
  mysql:
    image: mysql:8.4
    container_name: breathcare-mysql
    ports:
      # 호스트에 이미 MySQL이 설치돼 있는 경우가 많아 3306을 피한다.
      # 이 프로젝트는 호스트 3307로 접속한다. (컨테이너 내부는 3306 그대로)
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: breathcare
      MYSQL_USER: breathcare
      MYSQL_PASSWORD: ${DB_PASSWORD:-breathcare}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
