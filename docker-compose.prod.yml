# 배포용 전체 묶음 (서버 + DB). 노트북에서든 EC2에서든 같은 명령으로 뜬다.
#
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# docker-compose.yml(개발용 DB만)은 그대로 두었다. 팀원 로컬 환경을 건드리지 않기 위해서다.
# name을 따로 줘서 컨테이너·볼륨 이름이 개발용과 섞이지 않게 한다.
name: breathcare-prod

services:
  app:
    build: .
    image: breathcare-app:latest
    container_name: breathcare-app
    # 서버 재부팅이나 OOM으로 죽어도 알아서 살아난다. 학교 과제용 단일 서버에서는 이게 사실상의 무중단 장치다.
    restart: unless-stopped
    depends_on:
      mysql:
        # 단순 depends_on은 "컨테이너가 떴는가"만 본다. MySQL은 뜬 뒤에도 수십 초 초기화를 더 하는데,
        # 그 사이 Flyway가 붙으면 마이그레이션이 실패하면서 앱이 그대로 죽는다.
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 호스트명이 localhost가 아니라 서비스 이름 mysql이다. 컨테이너끼리는 내부 네트워크로 붙는다.
      DB_URL: "jdbc:mysql://mysql:3306/breathcare?characterEncoding=UTF-8&serverTimezone=Asia/Seoul"
      DB_USERNAME: breathcare
      # :? 는 값이 없으면 compose가 이 문구를 띄우고 멈춘다.
      # 기본값을 두면 운영 DB가 'breathcare' 같은 뻔한 비밀번호로 조용히 떠 버린다.
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env.prod에 넣어 주세요}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET을 .env.prod에 넣어 주세요 (32바이트 이상)}
      # 키 파일은 이미지에 굽지 않고 실행 시점에 읽기 전용으로 물린다.
      FIREBASE_CREDENTIALS: file:/app/secrets/firebase-service-account.json
      REPORT_PROVIDER: ${REPORT_PROVIDER:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
    volumes:
      - ./firebase-service-account.json:/app/secrets/firebase-service-account.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      # 이미지에 curl이 없어서 bash의 /dev/tcp로 포트만 두드린다. 의존성을 안 늘리는 방법.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 5s
      # 첫 기동은 Flyway까지 돌아서 오래 걸린다. 그동안은 실패로 세지 않는다.
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        # 안 막아 두면 로그가 디스크를 다 먹고 결국 DB까지 같이 멈춘다.
        max-size: "10m"
        max-file: "3"

  mysql:
    image: mysql:8.4
    container_name: breathcare-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD를 .env.prod에 넣어 주세요}
      MYSQL_DATABASE: breathcare
      MYSQL_USER: breathcare
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env.prod에 넣어 주세요}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    # 개발용과 달리 ports를 열지 않는다. 앱 컨테이너만 내부 네트워크로 접근하면 되고,
    # 포트를 열면 EC2 보안 그룹 설정 하나 잘못했을 때 DB가 인터넷에 그대로 노출된다.
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-data:
